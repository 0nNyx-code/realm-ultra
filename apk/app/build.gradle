plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.realmultra.mobile'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.realmultra.mobile'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            // APK rilis ditandatangani debug key dulu supaya bisa langsung di-install.
            // Ganti ke keystore sendiri kalau mau upload ke Play Store.
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
